spring:
  ai:
    # 本地默认使用项目内置的占位 ChatModel，避免未填写 Key 时 OpenAI 自动配置阻塞启动。
    model:
      chat: ${SPRING_AI_MODEL_CHAT:spark}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:unknown}
      image: ${SPRING_AI_MODEL_IMAGE:unknown}
      audio:
        speech: ${SPRING_AI_MODEL_AUDIO_SPEECH:unknown}
        transcription: ${SPRING_AI_MODEL_AUDIO_TRANSCRIPTION:unknown}
      moderation: ${SPRING_AI_MODEL_MODERATION:unknown}
    spark:
      # https://console.xfyun.cn/services/cbm
      # api-key 使用你自己申请的进行替换；如果为了安全考虑，可以通过启动参数进行设置
      base-url: https://spark-api-open.xf-yun.com/v1/chat/completions
      api-key: ${SPARK_API_KEY:}
      # 这里存储的是基于OpenAI-Starter的大模型交互的配置
      openai-client: true # ture 表示使用OpenAI的client来实现讯飞大模型交互； false 则表示使用自定义的 client 实现讯飞大模型交互
      openai-base-url: https://spark-api-open.xf-yun.com
      chat:
        options:
          model: lite
    openai:
      # openai chatgpt 大模型
      api-key: ${OPENAI_API_KEY:}
    dashscope:
      # 阿里的百炼大模型
      # https://bailian.console.aliyun.com/tab=model#/api-key
      api-key: ${DASHSCOPE_API_KEY:}
      # 多模态的图片推理模型
      multi-model: qwen3.5-omni-flash
      chat:
        options:
          model: qwen3.7-plus

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug
    com.git.hui.jobclaw.gather.service.GatherAiAgent: debug  # 开发时，输出debug调试日志，用于显示与大模型交互的输入/返回
    com.git.hui.jobclaw.agents.impl.BaseAgent: debug # 开发时，输出agent执行的日志
